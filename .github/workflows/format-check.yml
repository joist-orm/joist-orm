name: Format check

on:
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: yarn install
      - run: yarn format:check
      - run: yarn lint:skills
