extend type Query {
  publisher(id: ID!): Publisher!
  publishers(filter: PublisherFilter, limit: Int, offset: Int): PublishersPage!
}

extend type Mutation {
  savePublisher(input: SavePublisherInput!): SavePublisherResult!
}

type Publisher {
  id: ID!
  name: String!
  createdAt: Date!
  updatedAt: Date!
  size: PublisherSize
  authors: [Author!]!
  bookAdvances: [BookAdvance!]!
  images: [Image!]!
  latitude: Int
  longitude: Int
  hugeNumber: Int
  type: PublisherType
  group: PublisherGroup
  tags: [Tag!]!
  numberOfBookReviews: Int
  tasks: [Task!]!
  deletedAt: DateTime
  baseSyncDefault: String
  baseAsyncDefault: String!
  rating: Int
  status: PublisherStatusDetail
}

input SavePublisherInput {
  id: ID
  name: String
  createdAt: Date
  updatedAt: Date
  size: PublisherSize
  latitude: Int
  longitude: Int
  hugeNumber: Int
  type: PublisherType
  groupId: ID
  deletedAt: DateTime
  baseSyncDefault: String
  baseAsyncDefault: String
  rating: Int
  status: PublisherStatus
}

type SavePublisherResult {
  publisher: Publisher!
}

type PublishersPage {
  entities: [Publisher!]!
  pageInfo: PageInfo!
}

input PublisherFilter {
  id: [ID!]
  name: [String!]
  latitude: [Int!]
  longitude: [Int!]
  hugeNumber: [Int!]
  numberOfBookReviews: [Int!]
  deletedAt: [DateTime!]
  titlesOfFavoriteBooks: [String!]
  bookAdvanceTitlesSnapshot: [String!]
  numberOfBookAdvancesSnapshot: [String!]
  baseSyncDefault: [String!]
  baseAsyncDefault: [String!]
  createdAt: [DateTime!]
  updatedAt: [DateTime!]
  favoriteAuthorName: [String!]
  rating: [Int!]
  size: [PublisherSize!]
  type: [PublisherType!]
  favoriteAuthorId: [ID!]
  groupId: [ID!]
  spotlightAuthorId: [ID!]
  status: [PublisherStatus!]
}
