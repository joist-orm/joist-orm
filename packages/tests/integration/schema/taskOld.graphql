extend type Query {
  taskOld(id: ID!): TaskOld!
  taskOlds(filter: TaskOldFilter, limit: Int, offset: Int): TaskOldsPage!
}

extend type Mutation {
  saveTaskOld(input: SaveTaskOldInput!): SaveTaskOldResult!
}

type TaskOld {
  id: ID!
  specialOldField: Int
  type: String!
  durationInDays: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
  newTaskTaskItems: [TaskItem!]!
  oldTaskTaskItems: [TaskItem!]!
  taskTaskItems: [TaskItem!]!
  specialNewAuthor: Author
  publishers: [Publisher!]!
  comments: [Comment!]!
  parentOldTask: Task
  tasks: [Task!]!
  deletedAt: DateTime
  tags: [Tag!]!
  syncDefault: String
  asyncDefault_1: String
  asyncDefault_2: String
  syncDerived: String
  asyncDerived: String
  specialOldFieldWithDefault: Int!
  sharedSubtypeField: Int
}

input SaveTaskOldInput {
  id: ID
  specialOldField: Int
  type: String
  durationInDays: Int
  specialNewAuthorId: ID
  parentOldTaskId: ID
  deletedAt: DateTime
  syncDefault: String
  asyncDefault_1: String
  asyncDefault_2: String
  specialOldFieldWithDefault: Int
  sharedSubtypeField: Int
}

type SaveTaskOldResult {
  taskOld: TaskOld!
}

type TaskOldsPage {
  entities: [TaskOld!]!
  pageInfo: PageInfo!
}

input TaskOldFilter {
  id: [ID!]
  durationInDays: [Int!]
  deletedAt: [DateTime!]
  syncDefault: [String!]
  asyncDefault_1: [String!]
  asyncDefault_2: [String!]
  syncDerived: [String!]
  asyncDerived: [String!]
  createdAt: [DateTime!]
  updatedAt: [DateTime!]
  type: [TaskType!]
  copiedFromId: [ID!]
  specialOldField: [Int!]
  parentOldTaskId: [ID!]
  specialOldFieldWithDefault: [Int!]
  sharedSubtypeField: [Int!]
}
